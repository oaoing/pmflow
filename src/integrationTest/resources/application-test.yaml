spring:
  application:
    name: pmflow
  jpa:
    hibernate.ddl-auto: none        # ADR-0004
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
management:
  endpoints.web.exposure.include: health, info, prometheus
springdoc:
  swagger-ui.path: /swagger-ui.html
