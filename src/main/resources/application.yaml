spring:
  application:
    name: pmflow
  jpa:
    hibernate.ddl-auto: none        # ADR-0004
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration   # seed(db/seed)는 local/test 프로파일에서만 (ADR-0005)
management:
  endpoints.web.exposure.include: health, info, prometheus
springdoc:
  swagger-ui.path: /swagger-ui.html